name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Integration smoke
        run: ./ci/integration_smoke.sh
      - name: Fault injection
        run: ./ci/fault_injection.sh
      - name: Perf gate
        run: ./ci/perf_gate.sh
      - name: Golden replay
        run: |
          export PYTHONPATH=.
          python tests/golden_replay_test.py
      - name: Soak (short)
        run: |
          export PYTHONPATH=.
          for i in 1 2 3; do python benchmarks/harness.py; done
