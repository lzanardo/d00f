name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Perf smoke
        run: |
          python benchmarks/harness.py
